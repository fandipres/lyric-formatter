    <script>
        function formatAndCopyTitle() {
            const titleInput = document.getElementById('titleInput');
            if (!titleInput.value.trim()) return;

            const lowerCaseWords = ['feat', 'and'];
            const formatted = titleInput.value.toLowerCase().split(' ').map(word => {
                if (word.length === 0) return '';
                const cleaned = word.replace(/[^a-z]/g, '');
                if (lowerCaseWords.includes(cleaned)) return word;
                return word.charAt(0).toUpperCase() + word.slice(1);
            }).join(' ');
            titleInput.value = formatted;

            navigator.clipboard.writeText(formatted).then(() => {
                const btn = document.getElementById('formatCopyBtn');
                const originalText = btn.innerText;
                btn.innerText = 'Tersalin!';
                btn.classList.replace('bg-indigo-600', 'bg-emerald-500');
                btn.classList.replace('hover:bg-indigo-700', 'hover:bg-emerald-600');

                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.replace('bg-emerald-500', 'bg-indigo-600');
                    btn.classList.replace('hover:bg-emerald-600', 'hover:bg-indigo-700');
                }, 2000);
            });
        }

        function toggleModal() {
            const modal = document.getElementById('configModal');
            modal.classList.toggle('hidden');
        }

        function toggleGroup(selector, checked) {
            document.querySelectorAll(selector).forEach(cb => cb.checked = checked);
        }

        // Ambil kata utuh dari checkbox dan custom input
        function getExactWords() {
            let words = [];
            document.querySelectorAll('.exact-cb:checked').forEach(cb => words.push(cb.value));

            const customInput = document.getElementById('customWords').value;
            if (customInput.trim() !== '') {
                const customArray = customInput.split(',').map(w => w.trim()).filter(w => w.length > 0);
                words = words.concat(customArray);
            }
            return words;
        }

        // Ambil kata-kata yang PASTI bermakna Tuhan (tidak punya makna umum lain)
        function getDefiniteWords() {
            let words = [];
            document.querySelectorAll('.exact-cb.exact-cb-definite:checked').forEach(cb => words.push(cb.value));
            return words;
        }

        // Ambil data akhiran (nya, mu, ku)
        function getSuffixes() {
            let suffixes = [];
            document.querySelectorAll('.suffix-cb:checked').forEach(cb => suffixes.push(cb.value));
            return suffixes;
        }

        function processToCol2() {
            let text = document.getElementById('col1').value;
            if (!text.trim()) return;

            // 1. Bersihkan tanda baca
            text = text.replace(/[,.;]/g, '');

            // 2. Terapkan Sentence Case (kapitalisasi awal baris)
            let lines = text.split('\n');
            lines = lines.map(line => {
                let trimmed = line.trim().toLowerCase();
                if (trimmed.length === 0) return trimmed;
                // Jika diawali '(', kapitalisasi karakter setelahnya
                if (trimmed.startsWith('(') && trimmed.length > 1) {
                    return '(' + trimmed.charAt(1).toUpperCase() + trimmed.slice(2);
                }
                return trimmed.charAt(0).toUpperCase() + trimmed.slice(1);
            });
            text = lines.join('\n');

            // 3. Proses Exact Words (Kata Berdiri Sendiri)
            const exactWords = getExactWords();
            // Urutkan dari yang terpanjang agar frasa seperti "Roh Kudus" dieksekusi duluan
            exactWords.sort((a, b) => b.length - a.length);

            const definiteSet = new Set(getDefiniteWords().map(w => w.toLowerCase()));

            exactWords.forEach(word => {
                if (word.length === 0) return;

                if (!word.includes(' ') && definiteSet.has(word.toLowerCase())) {
                    // Kata yang pasti bermakna Tuhan: tetap terdeteksi walau menyatu dengan
                    // akhiran -ku/-mu/-nya (mis. "yesusku" -> "Yesusku"), akhiran dibiarkan
                    // apa adanya di sini dan baru dikapitalisasi di langkah 4 jika diaktifkan.
                    const regex = new RegExp(`\\b${word}(nya|mu|ku)?\\b`, 'gi');
                    text = text.replace(regex, (match, suffix) => suffix ? word + suffix.toLowerCase() : word);
                } else {
                    const regex = new RegExp(`\\b${word}\\b`, 'gi');
                    // Ganti dengan case persis seperti yang diinput user/checkbox
                    text = text.replace(regex, word);
                }
            });

            // 4. Proses Suffix (Akhiran Digabung seperti -Nya, -Mu)
            const suffixes = getSuffixes();
            if (suffixes.length > 0) {
                const exceptionInput = document.getElementById('exceptionWords').value;
                const exceptions = exceptionInput.split(',').map(w => w.trim().toLowerCase());

                // Buat peta lowercase → exact word untuk pencocokan cepat (hanya kata tunggal)
                const exactWordMap = {};
                exactWords.forEach(w => {
                    if (!w.includes(' ')) exactWordMap[w.toLowerCase()] = w;
                });

                const suffixPattern = suffixes.join('|');
                const suffixRegex = new RegExp(`\\b([a-zA-Z]+)(${suffixPattern})\\b`, 'gi');

                text = text.replace(suffixRegex, (match, base, suffix) => {
                    if (exceptions.includes(match.toLowerCase())) {
                        return match;
                    }
                    const capitalizedSuffix = suffix.charAt(0).toUpperCase() + suffix.slice(1).toLowerCase();
                    // Jika kata dasar ada di daftar exact words, kapitalisasi kata dasarnya juga
                    const matchedWord = exactWordMap[base.toLowerCase()];
                    if (matchedWord) {
                        return matchedWord + capitalizedSuffix;
                    }
                    return base + capitalizedSuffix;
                });
            }

            document.getElementById('col2').value = text;
        }

        function encodeAccents(str) {
            const map = {
                'á':'&aacute;', 'à':'&agrave;', 'â':'&acirc;', 'ä':'&auml;', 'ã':'&atilde;', 'å':'&aring;',
                'é':'&eacute;', 'è':'&egrave;', 'ê':'&ecirc;', 'ë':'&euml;',
                'í':'&iacute;', 'ì':'&igrave;', 'î':'&icirc;', 'ï':'&iuml;',
                'ó':'&oacute;', 'ò':'&ograve;', 'ô':'&ocirc;', 'ö':'&ouml;', 'õ':'&otilde;',
                'ú':'&uacute;', 'ù':'&ugrave;', 'û':'&ucirc;', 'ü':'&uuml;',
                'ñ':'&ntilde;', 'ç':'&ccedil;',
                'Á':'&Aacute;', 'À':'&Agrave;', 'Â':'&Acirc;', 'Ä':'&Auml;', 'Ã':'&Atilde;', 'Å':'&Aring;',
                'É':'&Eacute;', 'È':'&Egrave;', 'Ê':'&Ecirc;', 'Ë':'&Euml;',
                'Í':'&Iacute;', 'Ì':'&Igrave;', 'Î':'&Icirc;', 'Ï':'&Iuml;',
                'Ó':'&Oacute;', 'Ò':'&Ograve;', 'Ô':'&Ocirc;', 'Ö':'&Ouml;', 'Õ':'&Otilde;',
                'Ú':'&Uacute;', 'Ù':'&Ugrave;', 'Û':'&Ucirc;', 'Ü':'&Uuml;',
                'Ñ':'&Ntilde;', 'Ç':'&Ccedil;'
            };
            return str.replace(/[áàâäãåéèêëíìîïóòôöõúùûüñçÁÀÂÄÃÅÉÈÊËÍÌÎÏÓÒÔÖÕÚÙÛÜÑÇ]/g, match => map[match]);
        }

        function processToCol3() {
            let text = document.getElementById('col2').value;
            if (!text.trim()) return;

            text = encodeAccents(text);

            let lines = text.split('\n');
            let htmlOutput = lines.map(line => {
                return line + '<br />';
            }).join('\n');

            document.getElementById('col3').value = htmlOutput;
        }

function copyToClipboard() {
            const col3 = document.getElementById('col3');
            if (!col3.value.trim()) return;

            col3.select();
            col3.setSelectionRange(0, 99999); 
            navigator.clipboard.writeText(col3.value).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalHTML = btn.innerHTML;
                
                btn.classList.replace('bg-emerald-500', 'bg-slate-700');
                btn.classList.replace('hover:bg-emerald-600', 'hover:bg-slate-800');
                btn.innerHTML = '✓ Berhasil disalin!';
                
                setTimeout(() => {
                    btn.classList.replace('bg-slate-700', 'bg-emerald-500');
                    btn.classList.replace('hover:bg-slate-800', 'hover:bg-emerald-600');
                    btn.innerHTML = originalHTML;
                }, 2000);
            });
        }
    </script>
